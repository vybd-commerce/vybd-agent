# Optional: use if you don't have a local Postgres. Then set DATABASE_URL to port 5433.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vybd
      POSTGRES_PASSWORD: vybd
      POSTGRES_DB: vybd_agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
